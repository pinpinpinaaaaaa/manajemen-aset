# Production compose — database eksternal via Cloudflare Zero Trust tunnel.
#
# Ada dua cara deploy (pilih salah satu):
#
# [A] Pakai image dari ghcr.io (source code tidak ada di server):
#     → Isi GITHUB_USER di .env, pastikan sudah login ghcr.io di server
#     → docker compose -f docker-compose.prod.yml pull
#     → docker compose -f docker-compose.prod.yml up -d
#
# [B] Build dari source code (lebih mudah, tidak perlu akses registry):
#     → docker compose -f docker-compose.prod.yml up -d --build
#
# Wajib ada di .env di server — lihat .env.example untuk panduan lengkap.

services:

  # ─── PHP-FPM App ────────────────────────────────────────────
  app:
    image: ghcr.io/${GITHUB_USER:-local}/manajemen-aset-app:latest
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - simaster

  # ─── Nginx (web server + static files) ──────────────────────
  nginx:
    image: ghcr.io/${GITHUB_USER:-local}/manajemen-aset-nginx:latest
    build:
      context: .
      target: nginx-stage
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    networks:
      - simaster
    depends_on:
      - app

  # ─── Queue Worker ────────────────────────────────────────────
  worker:
    image: ghcr.io/${GITHUB_USER:-local}/manajemen-aset-app:latest
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=90"]
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - simaster

  # ─── Scheduler (rekap:bulanan tiap tgl 1 jam 00:00) ─────────
  scheduler:
    image: ghcr.io/${GITHUB_USER:-local}/manajemen-aset-app:latest
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - simaster

volumes:
  storage_data:

networks:
  simaster:
    driver: bridge
