server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Batas ukuran upload (foto aset, dokumen, dll.)
    client_max_body_size 64M;

    # File upload yang disimpan di storage — serve langsung dari volume
    # (menghindari kebutuhan symlink public/storage di container Nginx)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # Vite-built assets — cache agresif (nama file sudah include hash)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Semua request lain → coba file statis, lalu serahkan ke index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Proxy PHP ke php-fpm container (service "app" port 9000)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Blokir akses ke file .htaccess dan sejenisnya
    location ~ /\.ht {
        deny all;
    }
}
